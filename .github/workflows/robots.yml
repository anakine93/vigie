# Fait tourner les robots Vigie en continu sur les serveurs de GitHub (argent fictif, aucun ordre reel).
# Chaque passage dure environ 5 h 40 (stops verifies toutes les 30 s, etat publie toutes les 2 min),
# puis relance aussitot le passage suivant. La tache horaire est un filet de securite si la chaine s'arrete :
# un seul passage tourne a la fois, les autres attendent leur tour.
# L'etat des robots est stocke sur la branche "donnees", reecrite a chaque publication (sans historique,
# pour que le depot ne grossisse pas). Les avis des agents (branche "claude/avis") y sont recopies.
name: Robots Vigie

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: robots-vigie
  cancel-in-progress: false

jobs:
  robots:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TZ: Europe/Paris
      BINANCE_API: https://data-api.binance.vision/api/v3
      DEPOT: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    steps:
      - name: Recuperer les scripts
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperer l'etat des robots (branche donnees)
        run: |
          if git ls-remote --exit-code --heads "$DEPOT" donnees > /dev/null; then
            git clone -q --depth 1 --branch donnees "$DEPOT" donnees
          else
            mkdir donnees
          fi

      - name: Faire tourner les robots (environ 5 h 40)
        run: python robots/cloud.py --donnees ./donnees --duree 20400

      - name: Relancer le passage suivant
        # Pas de relance si le passage a ete annule a la main. Pour arreter les robots durablement :
        # onglet Actions > Robots Vigie > "..." > Disable workflow.
        if: success() || failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run robots.yml --ref "${{ github.ref_name }}" || echo "Relance impossible, la tache horaire prendra le relais."
